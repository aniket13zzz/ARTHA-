version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: artha_mvp
      POSTGRES_USER: artha
      POSTGRES_PASSWORD: artha123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
